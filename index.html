<title>Goo Field</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Krona+One&display=swap">
<style>
/* Layout: full-bleed WebGL field, a quiet HUD top-left, a compact instrument panel bottom-left. Single dark look by choice. */
:root {
  --bg: #121313;
  --panel: rgba(24, 25, 26, 0.82);
  --line: rgba(232, 236, 236, 0.14);
  --fg: #e8ecec;
  --muted: #8a9092;
  --accent: #f4f6f5;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
/* inverted: the UI flips with the field so it stays readable */
:root.inv {
  --bg: #edecec;
  --panel: rgba(236, 236, 235, 0.82);
  --line: rgba(18, 19, 19, 0.16);
  --fg: #121313;
  --muted: #62696b;
  --accent: #121313;
  color-scheme: light;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  overflow-x: hidden;
}
/* invisible scroll track: one screen per section, the field stays fixed behind */
.sections section { height: 100vh; height: 100svh; }
/* sections sit above the fixed canvas for their content, but let the field keep the pointer */
.sections { position: relative; z-index: 1; pointer-events: none; }
.hud, .secnav, .panel, .scope, .filters { z-index: 2; }
.sections .caps-hero h2, .sections .svc-list { pointer-events: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.label {
  position: absolute; left: 0; top: 0;
  font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
  opacity: 0; will-change: transform, opacity;
}
.label.on-core { color: var(--bg); }
.label.on-shell { color: var(--fg); }
.sec { display: grid; gap: 2px; margin-top: 12px; }
.sec span { font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.sec strong { font-size: 20px; font-weight: 500; letter-spacing: 0.01em; }
.sec.in { animation: sec-in 0.6s ease-out; }
@keyframes sec-in { from { opacity: 0.2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.secnav {
  position: fixed; top: 50%; transform: translateY(-50%);
  right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px; justify-items: end;
}
.secnav button {
  font: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); background: none; border: 0; padding: 2px 0; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
}
.secnav button::after { content: ""; width: 10px; height: 1px; background: currentColor; transition: width 0.3s; }
.secnav button[aria-current="true"] { color: var(--fg); }
.secnav button[aria-current="true"]::after { width: 28px; }
.secnav button:hover, .secnav button:focus-visible { color: var(--c, var(--fg)); }
@media (prefers-reduced-motion: reduce) { .sec.in { animation: none; } }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: none; }
.hud {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
  display: grid;
  gap: 4px;
}
.hud h1 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
.hud p { margin: 0; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.panel {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(280px, calc(100vw - 32px));
  background: var(--panel);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  display: grid;
  gap: 10px;
  font-size: 11px;
}
.panel summary { cursor: pointer; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); list-style: none; }
.panel summary::-webkit-details-marker { display: none; }
.panel details[open] summary { margin-bottom: 10px; }
.rows { display: grid; gap: 9px; }
.row { display: grid; grid-template-columns: 78px 1fr 34px; align-items: center; gap: 8px; }
.row label { color: var(--muted); }
.row output { text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button, .btns button {
  font: inherit; color: var(--fg); background: transparent; border: 0; padding: 6px 0; cursor: pointer;
}
.seg4 { grid-template-columns: repeat(4, 1fr); }
.seg4 button { font-size: 10px; padding: 6px 2px; line-height: 1.2; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btns button[aria-pressed="false"] { color: var(--muted); }
.btns button { border: 1px solid var(--line); border-radius: 6px; }
.btns button:hover, .seg button:hover { background: rgba(232,236,236,0.08); }
.seg button[aria-pressed="true"]:hover { background: var(--fg); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.scope {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(320px, calc(100vw - 32px));
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  display: grid;
  gap: 6px;
  font-size: 11px;
  pointer-events: none;
}
.scope header { display: flex; justify-content: space-between; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.scope header output { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.scope canvas { position: static; width: 100%; height: 72px; cursor: default; }
@media (max-width: 660px) {
  .scope { bottom: auto; top: calc(16px + env(safe-area-inset-top, 0px)); width: min(170px, calc(100vw - 32px)); }
  .scope canvas { height: 44px; }
}
.check input { accent-color: var(--accent); margin: 0; }
/* work thumbnails: DOM tiles riding on the shader's tile shapes */
.thumbs { position: fixed; inset: 0; pointer-events: none; }
.thumb {
  position: absolute; left: 0; top: 0; display: block; overflow: hidden;
  color: #e8ecec; text-decoration: none; opacity: 0; pointer-events: none;
  will-change: transform, opacity;
}
.thumb.live { pointer-events: auto; cursor: pointer; }
.thumb img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  filter: grayscale(1) contrast(1.08) brightness(0.72);
  transition: filter 0.35s ease, transform 0.6s ease;
}
.thumb:hover img, .thumb:focus-visible img { filter: none; transform: scale(1.05); }
.thumb .num, .thumb .meta {
  position: absolute; left: 9px; right: 9px; font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
}
.thumb .num { top: 7px; }
.thumb .meta { bottom: 7px; display: grid; gap: 1px; }
.thumb .meta strong { font-weight: 500; font-size: 11px; }
.thumb .meta span { color: rgba(232, 236, 236, 0.72); }
.thumb:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
.thumb .head {
  position: absolute; left: 14px; right: 14px; top: 50%; transform: translateY(-50%);
  font-size: clamp(14px, 1.5vw, 24px); line-height: 1.15; font-weight: 500;
}
.thumb.text { transition: background-color 0.35s ease; }
.thumb.text:hover, .thumb.text:focus-visible { background: rgba(232, 236, 236, 0.06); }
/* tag filters: AND together; a tag that would leave nothing greys out */
.filters {
  position: fixed; top: calc(24px + env(safe-area-inset-top, 0px)); left: 64px; right: 64px;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
  opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
}
.filters.on { opacity: 1; pointer-events: auto; }
.filters button {
  font: inherit; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--fg); background: var(--panel); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.25s, background-color 0.2s, color 0.2s;
}
.filters button .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.filters button:hover:not(:disabled) { border-color: var(--fg); }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters button[aria-pressed="true"] .n { color: inherit; opacity: 0.6; }
.filters button:disabled { opacity: 0.28; cursor: not-allowed; }
.filters .clear { border-style: dashed; }
.hud { transition: opacity 0.35s ease; }
body.in-work .hud, body.in-caps .hud { opacity: 0; }
/* the cards need the whole width: the controls and scope step aside while you read them */
.panel, .scope { transition: opacity 0.35s ease; }
body.in-caps .panel, body.in-caps .scope { opacity: 0; pointer-events: none; }

/* ---------- capabilities (Figma: Design System › Frame 109, Service Card set) ---------- */
:root {
  --f-loos-x: "Loos Extended", "Krona One", system-ui, sans-serif;
  --f-loos-w: "Loos Wide", "Krona One", system-ui, sans-serif;
  --f-galix: "Galix Mono", var(--mono);
}
.sections section.caps { height: auto; min-height: 100vh; padding-bottom: 96px; }
/* the heading pins to the top; each card pins below it, one step lower than the last, and the
   next card slides over it. --step is how much of a covered card stays visible. */
.caps { --hero-h: calc(40px + clamp(22px, 3.35vw, 48px)); --step: 108px; }
.caps-hero { position: sticky; top: 0; padding: 24px 24px 16px; box-sizing: border-box; z-index: 1; }
.caps-hero h2.goo { color: transparent; }
.caps-hero h2 {
  margin: 0; font-family: var(--f-loos-x); font-weight: 700; font-size: clamp(22px, 3.35vw, 48px);
  line-height: 1; color: #fff; letter-spacing: 0;
}
.svc-list { display: grid; gap: 32px; padding: 0 48px 45vh; margin-top: 178px; position: relative; }
.svc { position: sticky; top: calc(var(--hero-h) + var(--i) * var(--step)); }
/* cards ride their shader tiles (transform set per frame); the gaps let the cursor reach the field */
.svc { opacity: 0; will-change: transform, opacity; cursor: pointer; }
.sections .svc-list { pointer-events: none; }
.sections .svc { pointer-events: auto; }
/* clear the fixed section nav on the right so it never sits on the expand buttons */
@media (min-width: 701px) { .svc-list { padding-right: 150px; } }
.svc { display: flex; gap: 8px; align-items: stretch; min-height: 200px; color: #fff; }
.svc-id {
  flex: 0 0 65px; box-sizing: border-box; background: transparent; border-top: 4px solid var(--c);
  display: flex; align-items: center; justify-content: center; padding: 8px 10px;
}
.svc-id span {
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-family: var(--f-loos-x); font-weight: 700; font-size: 24px; line-height: 0.94; color: var(--c); white-space: nowrap;
}
.svc-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.svc-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.svc-meta > * {
  font-family: var(--f-galix); font-size: 12px; line-height: normal; padding: 4px 8px; border-radius: 2px;
  background: #000; color: #fff; border-bottom: 2px solid #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.svc-meta .num { font-weight: 500; }
.svc-meta .see {
  font: inherit; font-family: var(--f-galix); font-size: 12px; font-weight: 500; text-align: left; cursor: pointer;
  background: var(--c); color: #000; border: 0; border-bottom: 2px solid #000;
}
.svc-meta .see:hover { filter: brightness(1.12); }
.svc-body {
  flex: 1 1 auto; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  background: transparent; border-top: 4px solid #000; border-radius: 4px; padding: 10px 11px;
}
.svc.open .svc-body { padding: 10px 16px; }
.svc-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.svc-text h3 {
  margin: 0 0 8px; font-family: var(--f-loos-x); font-weight: 700; font-size: 48px; line-height: 0.94; color: var(--c);
}
.svc-text p { margin: 0; font-family: var(--f-galix); font-size: 16px; line-height: normal; color: #fff; text-wrap: balance; }
/* the open state's extra rows unfold with a 0fr → 1fr grid track */
.svc-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.45s cubic-bezier(.2, .7, .2, 1); }
.svc.open .svc-more { grid-template-rows: 1fr; }
.svc-more > div { overflow: hidden; min-height: 0; }
.svc-more ul {
  list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 8px;
  font-family: var(--f-loos-x); font-weight: 700; font-size: 24px; line-height: 0.94; color: #919191;
}
.svc-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; padding: 24px 0 14px; }
.svc-tools span {
  font-family: var(--f-galix); font-weight: 500; font-size: 12px; letter-spacing: 1.68px; text-transform: uppercase;
  color: #fff; background: #000; border: 2px solid #6b6b6b; border-radius: 4px; padding: 8px 14px; white-space: nowrap;
}
.svc-side { flex: 0 0 238px; display: flex; justify-content: flex-end; }
.svc-toggle {
  position: relative; width: 152px; height: 138px; flex: none; overflow: hidden; cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0;
  background: var(--c20); border: 1px solid var(--c); border-radius: 4px;
  font-family: var(--f-loos-w); font-weight: 700; font-size: 16px; color: var(--c);
}
.svc-toggle .arrow { position: absolute; left: calc(50% - 0.5px); bottom: -1px; transform: translateX(-50%); width: 115px; height: 157px; }
.svc-toggle .arrow img { display: block; }
.svc-toggle .arrow.up { transform: translateX(-50%) rotate(180deg); }
.svc-toggle .arrow.up, .svc.open .svc-toggle .arrow.down { display: none; }
.svc.open .svc-toggle .arrow.up { display: block; }
.svc-toggle .lbl { position: relative; }
.svc-toggle:hover { background: color-mix(in srgb, var(--c) 30%, transparent); }
.svc-toggle:focus-visible, .svc-meta .see:focus-visible { outline: 1px solid var(--c); outline-offset: 3px; }
@media (max-width: 700px) {
  .caps { --step: 72px; }
  .svc-list { padding: 0 16px 45vh; margin-top: 120px; }
  .svc-id { flex-basis: 40px; padding: 6px; }
  .svc-id span { font-size: 16px; }
  .svc-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .svc-body { flex-direction: column-reverse; }
  .svc-side { flex-basis: auto; align-self: stretch; }
  .svc-toggle { width: 100%; height: 56px; }
  .svc-toggle .arrow { display: none !important; }
  .svc-text h3 { font-size: 32px; }
  .svc-more ul { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .svc-more { transition: none; } }
@media (max-width: 700px) { .filters { left: 16px; right: 16px; justify-content: flex-start; } }
@media (prefers-reduced-motion: reduce) { .filters, .hud { transition: none; } }
@media (prefers-reduced-motion: reduce) { .thumb img { transition: none; } }
</style>

<canvas id="c"></canvas>

<div class="labels" id="labels" aria-hidden="true"></div>

<div class="thumbs" id="thumbs"></div>
<div class="filters" id="filters" role="group" aria-label="Filter case studies by tag"></div>

<main class="sections" id="sections"></main>

<div class="hud">
  <h1>Goo Field</h1>
  <p>scroll for sections · move to pull · click to pulse · space to morph</p>
  <p>sound starts on your first click</p>
  <div class="sec" id="sec"><span id="sec-name"></span><strong id="sec-title"></strong></div>
</div>

<nav class="secnav" id="secnav" aria-label="Sections"></nav>

<div class="scope" aria-hidden="true">
  <canvas id="scope"></canvas>
</div>

<div class="panel">
  <details open>
    <summary>Controls</summary>
    <div class="rows">
      <div class="seg" role="group" aria-label="Cursor mode">
        <button id="m-attract" aria-pressed="true">Attract</button>
        <button id="m-repel" aria-pressed="false">Repel</button>
        <button id="m-blob" aria-pressed="false">Blob only</button>
      </div>
      <div class="row"><label for="count">Balls</label><input id="count" type="range" min="6" max="96" value="53"><output id="count-o">53</output></div>
      <div class="row"><label for="k">Goo</label><input id="k" type="range" min="2" max="90" value="36"><output id="k-o">36</output></div>
      <div class="row"><label for="plus">Glyphs</label><input id="plus" type="range" min="0" max="24" value="16"><output id="plus-o">16</output></div>
      <div class="row"><label for="rd">RD field</label><input id="rd" type="range" min="0" max="100" value="70"><output id="rd-o">70%</output></div>
      <div class="row"><label for="contours">Contours</label><input id="contours" type="range" min="0" max="16" value="3"><output id="contours-o">3</output></div>
      <div class="row"><label for="spacing">Line gap</label><input id="spacing" type="range" min="6" max="48" value="18"><output id="spacing-o">18</output></div>
      <div class="row"><label for="glow">Glow</label><input id="glow" type="range" min="0" max="200" value="100"><output id="glow-o">1.0</output></div>
      <div class="row"><label for="stiff">Springs</label><input id="stiff" type="range" min="8" max="220" value="70"><output id="stiff-o">70</output></div>
      <div class="row"><label for="csize">Cursor size</label><input id="csize" type="range" min="0" max="70" value="30"><output id="csize-o">30</output></div>
      <div class="row"><label for="force">Pull force</label><input id="force" type="range" min="0" max="200" value="100"><output id="force-o">1.0</output></div>
      <div class="row"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="70"><output id="vol-o">70</output></div>
      <div class="seg seg4" role="group" aria-label="Dashed line">
        <button data-dash="0" aria-pressed="false">Solid</button>
        <button data-dash="1" aria-pressed="true">Dash contour</button>
        <button data-dash="2" aria-pressed="false">Dash orbit</button>
        <button data-dash="3" aria-pressed="false">Both</button>
      </div>
      <label class="check" for="morphclick"><input id="morphclick" type="checkbox" checked> Morph on click</label>
      <label class="check" for="mirror"><input id="mirror" type="checkbox"> Mirror down the centre (M)</label>
      <div class="btns">
        <button id="morph">Morph · Centred</button>
        <button id="reset">Reset</button>
        <button id="sound" aria-pressed="true">Sound on</button>
        <button id="invert" aria-pressed="false">Invert (I)</button>
      </div>
    </div>
  </details>
</div>

<script>
(() => {
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });
// shapes and glyphs share the fragment uniform budget (2 vec4 each); phones often only have ~221 slots
const MAXU = gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS);
const N = MAXU >= 320 ? 96 : 72;
const GN = Math.max(4, Math.min(24, Math.floor((MAXU - 2 * N - 24) / 2))); // perimeter/scatter glyphs
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- audio ----------
// A-minor pentatonic so every overlap lands in key.
const SCALE = [0, 3, 5, 7, 10];
const noteFreq = i => 110 * Math.pow(2, (SCALE[((i % 5) + 5) % 5] + 12 * Math.floor(i / 5)) / 12);
const A = { ctx: null, on: true, vol: 0.7, speed: 0, lastTick: 0, lastCascade: 0 };
const clampPan = v => Math.max(-0.9, Math.min(0.9, v));

function audioInit() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = A.ctx = new AC();
  A.master = ctx.createGain();
  A.master.gain.value = A.on ? A.vol : 0;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 4;
  A.master.connect(comp); comp.connect(ctx.destination);
  A.analyser = ctx.createAnalyser();
  A.analyser.fftSize = 2048;
  A.scopeBuf = new Float32Array(A.analyser.fftSize);
  comp.connect(A.analyser);
  A.bus = ctx.createGain(); A.bus.connect(A.master);

  // ping-pong delay with a darkening feedback loop
  A.send = ctx.createGain(); A.send.gain.value = 0.4;
  const dl = ctx.createDelay(1), dr = ctx.createDelay(1);
  dl.delayTime.value = 0.24; dr.delayTime.value = 0.36;
  const fb = ctx.createGain(); fb.gain.value = 0.42;
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2400;
  const pl = ctx.createStereoPanner(); pl.pan.value = -0.75;
  const pr = ctx.createStereoPanner(); pr.pan.value = 0.75;
  A.send.connect(dl);
  dl.connect(pl); pl.connect(A.master);
  dl.connect(dr); dr.connect(pr); pr.connect(A.master);
  dr.connect(tone); tone.connect(fb); fb.connect(dl);

  // drone that follows the cursor
  A.droneGain = ctx.createGain(); A.droneGain.gain.value = 0;
  A.droneFilter = ctx.createBiquadFilter();
  A.droneFilter.type = 'lowpass'; A.droneFilter.frequency.value = 200; A.droneFilter.Q.value = 7;
  A.droneOscs = [['sawtooth', 55], ['sawtooth', 55.35], ['sine', 110]].map(([type, f]) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    o.connect(A.droneFilter); o.start(); return o;
  });

function drawScope(time) {
  const r = window.devicePixelRatio || 1;
  const w = Math.round(scope.clientWidth * r), h = Math.round(scope.clientHeight * r);
  if (scope.width !== w || scope.height !== h) { scope.width = w; scope.height = h; }
  sctx.clearRect(0, 0, w, h);

  // graticule
  sctx.strokeStyle = invert ? 'rgba(18,19,19,0.1)' : 'rgba(232,236,236,0.08)';
  sctx.lineWidth = 1;
  sctx.beginPath();
  for (let i = 1; i < 8; i++) { const x = Math.round(w * i / 8) + 0.5; sctx.moveTo(x, 0); sctx.lineTo(x, h); }
  sctx.moveTo(0, Math.round(h / 2) + 0.5); sctx.lineTo(w, Math.round(h / 2) + 0.5);
  sctx.stroke();

  const span = 900; // samples shown
  let buf = null, start = 0, peak = 0, rms = 0;
  if (A.analyser && A.ctx.state === 'running') {
    buf = A.scopeBuf;
    A.analyser.getFloatTimeDomainData(buf);
    // trigger on a rising zero crossing so the wave holds still
    for (let i = 1; i < buf.length - span; i++) {
      if (buf[i - 1] < 0 && buf[i] >= 0) { start = i; break; }
    }
    for (let i = 0; i < buf.length; i++) { const v = buf[i]; peak = Math.max(peak, Math.abs(v)); rms += v * v; }
    rms = Math.sqrt(rms / buf.length);

  // auto gain: quiet signals still read, loud ones don't clip
  const want = Math.min(10, 0.85 / Math.max(peak, 0.04));
  scopeGain += (want - scopeGain) * 0.08;

  sctx.beginPath();
  for (let i = 0; i <= span; i += 2) {
    const x = i / span * w;
    const v = buf ? buf[start + i] * scopeGain : Math.sin(i * 0.05 + time * 2) * 0.015;
    const y = h / 2 - Math.max(-1, Math.min(1, v)) * h * 0.46;
    i === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);

  sctx.lineWidth = 1.25 * r;
  sctx.shadowColor = scopeGlow;
  sctx.shadowBlur = 8 * r;

    scopeO.textContent = rms > 1e-5 ? (20 * Math.log10(rms)).toFixed(1) + ' dB' : '-∞ dB';

float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float sdBox(vec2 p, vec2 b){ vec2 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, d.y), 0.); }
// circle → square family: cr is the corner radius as a fraction of r (1 = circle)
float shp(vec2 q, float r, float cr){ return sdBox(q, vec2(r * (1. - cr))) - r * cr; }
// glyph a = (x, y, size, rot), b = (type, param, style bits, inner frac); returns local coords + minor half-extent
float glyphSD(vec4 a, vec4 b, vec2 p, out vec2 q, out float mn){
  q = p - a.xy;
  float c = cos(a.w), s = sin(a.w);
  q = vec2(c * q.x + s * q.y, -s * q.x + c * q.y);
  float sz = a.z;
  if (b.x < 0.5) { mn = sz * b.y; return min(sdBox(q, vec2(sz - mn, 0.)), sdBox(q, vec2(0., sz - mn))) - mn; }
  if (b.x < 1.5) { mn = sz * b.y; return sdBox(q, vec2(sz - mn, 0.)) - mn; }
  mn = sz; return shp(q, sz, b.y);
}
// dash mask along a closed curve, parameterised by angle × radius (≈ arc length)
float dashes(vec2 q, float r, float len){
  float t = fract(atan(q.y, q.x) * r / len);
  return smoothstep(0., 0.06, t) * (1. - smoothstep(0.5, 0.56, t));
}

vec3 scene(vec2 p){
  vec2 pr = p; // unmirrored, so the cursor blob only shows where the cursor is
  if (uMirror > 0.5) p.x = -abs(p.x); // left half reflected onto the right
  float px = 1. / uScale;
  float aa = px * 1.1;

  // shockwave locally boosts gooeyness
  float sk = 0.;
  float shockLine = 0.;
  if (uShock.w > 0.001) {
    float dd = length(p - uShock.xy) - uShock.z;
    sk = uShock.w * exp(-dd * dd / 5000.);
    shockLine = uShock.w * (1. - smoothstep(0., px * 1.5, abs(dd)));
  }
  float k = uK * (1. + sk * 2.5);

  float core = 1e5, shell = 1e5, holes = 1e5, dots = 1e5, dim = 1e5, rings = 1e5;
  float pillO = 1e5, pillF = 1e5, slotW = 1e5, slotD = 1e5;

  for (int i = 0; i < N; i++) {
    if (i >= uCount) break;
    vec4 A = uA[i], B = uB[i];
    // B.w packs layer + 4 * corner (0-255, 255 = round). Round shapes are capsules A→B;
    // cornered ones are boxes centred on A, with |B - A| as extra half-extent (rectangles)
    float lay = mod(B.w, 4.), cr = floor(B.w / 4.) / 255.;
    vec2 lq = p - A.xy;
    float rr = A.z * 0.92;
    float d = cr > 0.99 ? sdSeg(p, A.xy, B.xy, A.z) : sdBox(lq, vec2(rr * (1. - cr)) + abs(B.xy - A.xy)) - rr * cr;
    if (lay < 0.5) {
      core = smin(core, d, k);
      shell = smin(shell, d - (A.z * 0.3 + 16.) * (1. - uWork), k * 2.2);
      if (B.z > 0.) { holes = min(holes, shp(lq, B.z, cr)); if (A.w > 0.) dots = min(dots, shp(lq, B.z * A.w, cr)); }
      else if (B.z < 0.) holes = min(holes, shp(lq, -B.z, cr));
    } else if (lay < 1.5) {
      shell = smin(shell, d, k * 2.2);
      if (A.w > 0.5 && A.w < 1.5) dots = min(dots, shp(lq, 3.5, cr));
      else if (A.w > 1.5 && A.w < 2.5) dim = min(dim, shp(lq, A.z * 0.42, cr));
      else if (A.w > 2.5) { rings = min(rings, abs(shp(lq, A.z * 0.42, cr)) - 1.2); dots = min(dots, shp(lq, A.z * 0.2, cr)); }
    } else {
      if (A.w > 0.5) { pillF = min(pillF, d); if (B.z > 0.) slotD = min(slotD, sdSeg(p, A.xy, B.xy, B.z)); }
      else { pillO = min(pillO, d); if (B.z > 0.) slotW = min(slotW, sdSeg(p, A.xy, B.xy, B.z)); }
    }
  }
  if (uMouse.z > 0.5) {
    float dm = length(pr - uMouse.xy) - uMouse.z;
    core = smin(core, dm, k * 1.2);
    shell = smin(shell, dm - 22., k * 2.2);
  }
  // the capabilities heading joins the goo: distance comes from its blurred glyph texture, so
  // blobs and the cursor bridge into the letters and the contours wrap the word
  if (uTextAmt > 0.001) {
    vec2 tuv = (pr - uTextRect.xy) / uTextRect.zw;
    if (tuv.x > 0. && tuv.x < 1. && tuv.y > 0. && tuv.y < 1.) {
      vec3 t = texture2D(uText, tuv).rgb;
      if (t.b > 0.02) {
        float dS = uTextSig.x * 2.5 * (0.5 - t.g);
        float dR = uTextSig.y * 2.5 * (0.5 - t.b);
        float dt = (t.g > 0.15 ? dS : max(dS, dR)) + (1. - uTextAmt) * 120.;
        core = smin(core, dt, k);
        shell = smin(shell, dt - 16. * (1. - uWork), k * 2.2);
      }
    }
  }
  float coreCut = max(core, -holes);

  vec3 col = vec3(0.071, 0.075, 0.075);
  // vignette lift toward centre
  col += 0.025 * exp(-dot(p, p) / 160000.);

  // reaction-diffusion field behind everything (shell fills cover it)
  if (uRDAmt > 0.001) {
    vec2 suv = vec2((p.x * uScale + uRes.x * 0.5) / uRes.x, 1. - (p.y * uScale + uRes.y * 0.5) / uRes.y);
    float rdm = smoothstep(0.18, 0.22, texture2D(uRD, suv).g);
    col = mix(col, vec3(0.16, 0.165, 0.165), rdm * uRDAmt);
  }

  // orbit lines behind everything: heavy → hairline, then a dashed one (like the line sheet).
  // Their metric blends circle / square / diamond / drum with the current layout.
  vec2 oc = p - vec2(20., 10.) * uOrb.x;
  vec2 ao = abs(oc);
  float ol = uOrb.x * length(oc) + uOrb.y * max(ao.x, ao.y) * 1.02
           + uOrb.z * (ao.x + ao.y) * 0.8 + uOrb.w * max(ao.x * 1.5, ao.y * 0.78);
  float orbit = 0.;
  for (int j = 0; j < 4; j++) {
    float r = 300. + float(j) * 26.;
    float w = j == 0 ? 2.4 : j == 1 ? 1.2 : j == 2 ? 0.5 : 0.8;
    float l = 1. - smoothstep(0., px * 1.1, abs(ol - r) - w * 0.5);
    if (j == 3) l *= mod(uDash, 4.) > 1.5 ? dashes(oc, ol, 11.) : 0.;
    orbit = max(orbit, l);
  }
  col = mix(col, vec3(0.62), orbit * 0.32);

  // shell: dark fill + thin outline
  float sf = 1. - smoothstep(-aa, aa, shell);
  col = mix(col, vec3(0.098, 0.102, 0.104), sf);
  col = mix(col, vec3(0.30), (1. - smoothstep(-aa, aa, dim)) * sf);
  float so = 1. - smoothstep(0., px * 1.3, abs(shell) - px * 0.3);
  col = mix(col, vec3(0.78), so * 0.7);

  // topographic contours: iso-lines of the shell field stepping outward
  for (int j = 0; j < 16; j++) {
    if (float(j) >= uContours) break;
    float off = float(j + 1) * uSpacing;
    float w = j == 0 ? 1.1 : j == 1 ? 0.55 : 0.25;
    float cl = 1. - smoothstep(0., px * 1.2, abs(shell - off) - max(w, px * 0.25));
    if (j == 1 && mod(uDash, 2.) > 0.5) cl *= dashes(p, length(p), 10.);
    col = mix(col, vec3(0.72), cl * 0.5 * (1. - float(j) / (uContours + 1.)));
  }

  // white-filled glyphs feed the glow
  float pmW = 1e5;
  for (int i = 0; i < GN; i++) {
    if (i >= uGCount) break;
    vec2 gq; float gm;
    if (mod(uGb[i].z, 4.) > 1.5) pmW = min(pmW, glyphSD(uGa[i], uGb[i], p, gq, gm));
  }
  col = mix(col, vec3(0.85), (1. - smoothstep(-aa, aa, rings)) * 0.85);

  // shockwave ring
  col = mix(col, vec3(0.9), shockLine * 0.35);

  // glow from bright things
  float gd = min(coreCut, min(min(pillF, slotW), pmW));
  gd = max(gd, 0.);
  col += uGlow * (0.22 * exp(-gd / 70.) + 0.18 * exp(-gd / 14.)) * vec3(0.95, 0.97, 0.97);

  // outlined pills
  float po = 1. - smoothstep(-aa, aa, pillO);
  col = mix(col, vec3(0.085), po);
  col = mix(col, vec3(0.92), (1. - smoothstep(0., px * 1.4, abs(pillO) - px * 0.5)));
  col = mix(col, vec3(0.94), 1. - smoothstep(-aa, aa, slotW));

  // glyphs: fill (none / black / white), white stroke, then a contrasting inner mark
  for (int i = 0; i < GN; i++) {
    if (i >= uGCount) break;
    vec4 gb = uGb[i];
    vec2 q; float mn;
    float d = glyphSD(uGa[i], gb, p, q, mn);
    if (d > 6.) continue;
    float fill = mod(gb.z, 4.), sw = mod(floor(gb.z / 4.), 4.), inner = floor(gb.z / 16.);
    vec3 cc = fill > 1.5 ? vec3(0.035) : vec3(0.94); // contrast colour for the inner mark
    if (fill > 0.5) col = mix(col, fill > 1.5 ? vec3(0.94) : vec3(0.035), 1. - smoothstep(-aa, aa, d));
    float w = sw * 1.1;
    if (sw > 0.5) col = mix(col, vec3(0.93), 1. - smoothstep(-aa, aa, abs(d + w * 0.5) - w * 0.5));
    if (inner > 0.5) {
      float di;
      if (inner < 1.5) di = abs(d + gb.w * mn) - mn * 0.1;
      else if (inner < 2.5) di = sdBox(q, vec2(mn * gb.w));
      else if (inner < 3.5) di = length(q) - mn * gb.w;
      else di = abs(d + gb.w * mn) - max(w, 1.) * 0.5;
      col = mix(col, cc, 1. - smoothstep(-aa, aa, di));
    }
  }

  // core goo
  float cf = 1. - smoothstep(-aa, aa, coreCut);
  float shade = 0.9 + 0.06 * smoothstep(0., -40., core);
  col = mix(col, vec3(shade, shade + 0.01, shade + 0.01), cf);
  // faint rim inside holes
  float hr = (1. - smoothstep(0., px * 1.2, abs(holes) - px * 0.3)) * (1. - smoothstep(-aa, aa, core));
  col = mix(col, vec3(0.6), hr * 0.5);

  // filled pills
  col = mix(col, vec3(0.94), 1. - smoothstep(-aa, aa, pillF));
  col = mix(col, vec3(0.085), 1. - smoothstep(-aa, aa, slotD));

  // dots
  col = mix(col, vec3(0.95), 1. - smoothstep(-aa, aa, dots));

  return col;
}

// click palette: copper, yellow, green, cyan, lilac
vec3 pal(float i){
  if (i < 0.5) return vec3(213., 143., 101.) / 255.;
  if (i < 1.5) return vec3(229., 218., 73.) / 255.;
  if (i < 2.5) return vec3(116., 210., 141.) / 255.;
  if (i < 3.5) return vec3(121., 212., 236.) / 255.;
  return vec3(185., 157., 227.) / 255.;
}
vec3 palCycle(float t){
  float f = mod(t, 5.);
  float i = floor(f);
  return mix(pal(i), pal(mod(i + 1., 5.)), smoothstep(0., 1., f - i));
}

void main(){
  vec2 fc = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 p = (fc - uRes * 0.5) / uScale;
  vec2 pf = p;
  if (uMirror > 0.5) pf.x = -abs(pf.x);
  vec3 col;
  if (uFlash > 0.01) {
    // chromatic split: five palette taps fanned out radially from the click
    vec2 dir = pf - uShock.xy;
    dir = dir / max(length(dir), 1.);
    dir = normalize(dir + vec2(0.35, 0.));
    if (uMirror > 0.5 && p.x > 0.) dir.x = -dir.x;
    float amt = uFlash * 16.;
    vec3 acc = vec3(0.), wsum = vec3(0.);
    for (int i = 0; i < 5; i++) {
      float t = (float(i) - 2.) * 0.5;
      vec3 c = pal(float(i));
      float l = dot(scene(p + dir * amt * t), vec3(0.3333));
      acc += c * l; wsum += c;
    }
    col = acc / wsum;
    // whole field tints through the palette as the flash decays
    vec3 cyc = palCycle((1. - uFlash) * 5. + length(p) / 400.);
    col = mix(col, col * cyc * 1.35, uFlash * 0.55);
  } else {
    col = scene(p);
  }
  // nav hover tint: whites take the colour, darks stay dark
  col = mix(col, 1. - col, uInvert);
  col = mix(col, col * uTint * 1.08, uTintAmt);
  // grain
  col += (hash(fc + fract(uTime) * 100.) - 0.5) * 0.035;
  gl_FragColor = vec4(col, 1.);
}`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['uRes', 'uScale', 'uTime', 'uA', 'uB', 'uCount', 'uMouse', 'uShock', 'uK', 'uGlow', 'uContours', 'uSpacing', 'uFlash', 'uGa', 'uGb', 'uGCount', 'uOrb', 'uDash', 'uMirror', 'uTint', 'uTintAmt', 'uInvert', 'uRD', 'uRDAmt', 'uWork', 'uText', 'uTextRect', 'uTextSig', 'uTextAmt'])
  U[n] = gl.getUniformLocation(prog, n);
const arrA = new Float32Array(N * 4), arrB = new Float32Array(N * 4);
const arrGa = new Float32Array(GN * 4), arrGb = new Float32Array(GN * 4);

// ---------- sizing ----------
let W = 0, H = 0, dpr = 1, scale = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.round(canvas.clientWidth * dpr);
  H = Math.round(canvas.clientHeight * dpr);
  canvas.width = W; canvas.height = H;
  gl.viewport(0, 0, W, H);
  scale = Math.min(W / 980, H / 1060);
}
addEventListener('resize', resize);
resize();

// ---------- reaction-diffusion (port of commms src/three/background.ts) ----------
// Gray-Scott "coral growth": ping-pong float textures, low-res grid, cursor erase
// brush, spontaneous reseeds. Clicks plant a bloom where the pulse fires.
const rd = (() => {
  const SIM_MAX = 512, STEPS = 6, BURN_IN = 300, FEED = 0.0545, KILL = 0.062;
  const BRUSH = 16, RESEED_R = 5;
  const hf = gl.getExtension('OES_texture_half_float');
  const hfLin = gl.getExtension('OES_texture_half_float_linear');
  gl.getExtension('EXT_color_buffer_half_float');
  const fl = gl.getExtension('OES_texture_float');
  const flLin = gl.getExtension('OES_texture_float_linear');
  gl.getExtension('WEBGL_color_buffer_float');
  const candidates = [];
  if (hf) candidates.push([hf.HALF_FLOAT_OES, !!hfLin]);
  if (fl) candidates.push([gl.FLOAT, !!flLin]);

  const VS = `attribute vec2 p; varying vec2 vUv; void main(){ vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0., 1.); }`;
  const INIT = `precision highp float; varying vec2 vUv; uniform vec2 uSimDims; uniform float uSeed;
  float h(vec2 q){ return fract(sin(dot(q, vec2(12.9898, 78.233)) + uSeed) * 43758.5453); }
  void main(){ vec2 cell = floor(vUv * uSimDims / 7.); gl_FragColor = vec4(1., step(0.988, h(cell)), 0., 1.); }`;
  const SIM = `precision highp float;
  varying vec2 vUv;
  uniform sampler2D uState; uniform vec2 uTexel; uniform float uFeed; uniform float uKill;
  uniform vec2 uMouse; uniform vec2 uSimDims; uniform float uBrushR; uniform vec2 uSeedPos; uniform float uSeedR;
  void main(){
    vec2 uv = vUv;
    vec2 c = texture2D(uState, uv).rg;
    vec2 lap = -c;
    lap += 0.2 * texture2D(uState, uv + vec2(uTexel.x, 0.)).rg;
    lap += 0.2 * texture2D(uState, uv - vec2(uTexel.x, 0.)).rg;
    lap += 0.2 * texture2D(uState, uv + vec2(0., uTexel.y)).rg;
    lap += 0.2 * texture2D(uState, uv - vec2(0., uTexel.y)).rg;
    lap += 0.05 * texture2D(uState, uv + uTexel).rg;
    lap += 0.05 * texture2D(uState, uv - uTexel).rg;
    lap += 0.05 * texture2D(uState, uv + vec2(uTexel.x, -uTexel.y)).rg;
    lap += 0.05 * texture2D(uState, uv + vec2(-uTexel.x, uTexel.y)).rg;
    float A = c.r, B = c.g;
    float reaction = A * B * B;
    float nextA = A + (1.0 * lap.r - reaction + uFeed * (1.0 - A));
    float nextB = B + (0.5 * lap.g + reaction - (uKill + uFeed) * B);
    float d = length((vUv - uMouse) * uSimDims);
    nextB = mix(nextB, 0.0, 1.0 - smoothstep(uBrushR * 0.4, uBrushR, d));
    float ds = length((vUv - uSeedPos) * uSimDims);
    nextB = max(nextB, (1.0 - smoothstep(uSeedR * 0.3, uSeedR, ds)) * 0.9);
    gl_FragColor = vec4(clamp(nextA, 0., 1.), clamp(nextB, 0., 1.), 0., 1.);
  }`;
  const mk = (fsrc) => {
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fsrc));
    gl.bindAttribLocation(pr, 0, 'p');
    gl.linkProgram(pr);
    const u = {};
    for (const n of ['uState', 'uTexel', 'uFeed', 'uKill', 'uMouse', 'uSimDims', 'uBrushR', 'uSeedPos', 'uSeedR', 'uSeed'])
      u[n] = gl.getUniformLocation(pr, n);
    return { pr, u };
  };
  let simP, initP;
  try { simP = mk(SIM); initP = mk(INIT); } catch (e) { console.warn('RD disabled:', e); return null; }

  let type = 0, linear = false, w = 0, h = 0, read = null, write = null;
  const target = (tw, th, ty, lin) => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    const f = lin ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, tw, th, 0, gl.RGBA, ty, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { t, fb, ok };
  };
  const free = (x) => { if (x) { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.fb); } };
  const draw = () => {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  const seedPos = [-10, -10];
  let seedR = RESEED_R;
  const step = (mouseUv) => {
    gl.useProgram(simP.pr);
    gl.uniform2f(simP.u.uTexel, 1 / w, 1 / h);
    gl.uniform1f(simP.u.uFeed, FEED);
    gl.uniform1f(simP.u.uKill, KILL);
    gl.uniform2f(simP.u.uSimDims, w, h);
    gl.uniform1f(simP.u.uBrushR, BRUSH);
    gl.uniform1f(simP.u.uSeedR, seedR);
    gl.uniform2f(simP.u.uMouse, mouseUv[0], mouseUv[1]);
    gl.uniform2f(simP.u.uSeedPos, seedPos[0], seedPos[1]);
    gl.uniform1i(simP.u.uState, 0);
    gl.viewport(0, 0, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, write.fb);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, read.t);
    draw();
    const s = read; read = write; write = s;
    seedPos[0] = seedPos[1] = -10; // a seed is active for one step only
    seedR = RESEED_R;
  };
  const build = () => {
    const aspect = W / H;
    const nw = aspect >= 1 ? SIM_MAX : Math.round(SIM_MAX * aspect);
    const nh = aspect >= 1 ? Math.round(SIM_MAX / aspect) : SIM_MAX;
    if (nw === w && nh === h && read) return true;
    free(read); free(write); read = write = null;
    for (const [ty, lin] of candidates) {
      const a = target(nw, nh, ty, lin), b = target(nw, nh, ty, lin);
      if (a.ok && b.ok) { read = a; write = b; type = ty; linear = lin; break; }
      free(a); free(b);
    }
    if (!read) return false;
    w = nw; h = nh;
    gl.useProgram(initP.pr);
    gl.uniform2f(initP.u.uSimDims, w, h);
    gl.uniform1f(initP.u.uSeed, Math.random() * 100);
    gl.viewport(0, 0, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, read.fb);
    draw();
    for (let i = 0; i < BURN_IN; i++) step([-10, -10]);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return true;
  };
  if (!candidates.length || !build()) { console.warn('RD disabled: no renderable float textures'); return null; }

  let clock = 0, nextSeed = 4 + Math.random() * 2;
  return {
    tex: () => read.t,
    rebuild: build,
    splat(u, v, r) { seedPos[0] = u; seedPos[1] = v; seedR = r; },
    update(dt, mouseUv) {
      if (reduce) return;
      clock += dt;

      if (q.s < 0.5) { q.touch = false; continue; }
      const d = Math.hypot(q.x - mouse.x, q.y - mouse.y) - q.size - mouse.r;
      if (!q.touch && d < 4) {
        q.touch = true;
        if (tnow - q.lastT > 0.18 && tnow - A.lastTick > 0.03) {
          q.lastT = A.lastTick = tnow;
          tick(q.freq * 2, panOf(q.x), 0.035, 'square', 0.05);
        }
      } else if (q.touch && d > 16) q.touch = false;
    }
  }

  // work thumbnails ride their tile nodes and fade in once the grid has mostly formed
  workAmt = (from === WORK ? 1 - m : 0) + (to === WORK ? m : 0);
  const G = grid();
  const ta = Math.max(0, (workAmt - 0.7) / 0.3);
  const inWork = section === 1 && workAmt > 0.6;
  if (inWork !== filtersEl.classList.contains('on')) {
    filtersEl.classList.toggle('on', inWork);
    document.body.classList.toggle('in-work', inWork);
  }
  document.body.classList.toggle('in-caps', SECTIONS[section].name === 'Capabilities');
  for (const T of thumbs) {
    const n = tileNode[T.i];
    if (!n) continue;
    const shown = G.slot.has(T.i);
    T.a += ((shown ? ta : 0) - T.a) * (1 - Math.exp(-dt * 9));
    n.hov = (n.hov || 0) + ((T.hover ? 1 : 0) - (n.hov || 0)) * (1 - Math.exp(-dt * 10));
    const k = (1 + 0.02 * n.hov) * scale / dpr, inset = 3 * G.u;
    const w = (G.tw - inset * 2) * k, h = (G.th - inset * 2) * k;
    const sx = (n.x * scale + W / 2) / dpr, sy = (n.y * scale + H / 2) / dpr;
    T.el.style.width = w.toFixed(1) + 'px'; T.el.style.height = h.toFixed(1) + 'px';
    T.el.style.borderRadius = '9px';
    T.el.style.transform = `translate3d(${(sx - w / 2).toFixed(1)}px, ${(sy - h / 2).toFixed(1)}px, 0)`;
    T.el.style.opacity = (T.a * T.a).toFixed(3);
    const live = shown && T.a > 0.6;
    if (live !== T.live) { T.live = live; T.el.classList.toggle('live', live); T.el.tabIndex = live ? 0 : -1; }
  }

  capsAmt = (from === CAPS ? 1 - m : 0) + (to === CAPS ? m : 0);
  const ca = Math.max(0, (capsAmt - 0.45) / 0.55);
  svcCards.forEach((C, i) => {
    const n = capNode[2 * i], r = capsGeo && capsGeo.rects[2 * i];
    if (n && r && capsAmt > 0.01) {
      const u = dpr / scale;
      C.dx = (n.x - r.cx) / u * capsAmt; C.dy = (n.y - r.cy) / u * capsAmt;
    } else { C.dx = 0; C.dy = 0; }
    C.el.style.transform = `translate3d(${C.dx.toFixed(1)}px, ${C.dy.toFixed(1)}px, 0)`;
    C.el.style.opacity = (ca * ca).toFixed(3);
    C.el.style.pointerEvents = ca > 0.5 ? "auto" : "none";
    // the next card covers this one: hide what's underneath (the backgrounds are the shader's)
    const cutPx = capsAmt > 0.01 ? C.cut || 0 : 0;
    C.el.style.clipPath = cutPx > 0.5 ? `inset(0 0 ${cutPx.toFixed(1)}px 0)` : 'none';
  });

  // labels: the blob swells and clears its centre, then the text fades in on top of it
  for (const n of nodes) n.labT = 0;
  const fs = flash > 0.02 ? flash * 3 : 0;
  for (const L of labels) {
    const target = L.si === section && L.node.s > 0.5 ? 1 : 0;
    L.a += (target - L.a) * (1 - Math.exp(-dt * (target ? 5 : 9)));
    // in mirror mode the right half shows the left twin's reflection, so ride that
    const useTwin = mirror && L.node.rax > 0 && L.twin;
    const src = useTwin ? L.twin : L.node;
    src.labT = Math.max(src.labT, L.a);
    const x = useTwin ? -src.x : src.x;
    const sx = (x * scale + W / 2) / dpr, sy = (src.y * scale + H / 2) / dpr;
    const rr = src.r * (1 + 0.22 * L.a) * scale / dpr;
    L.el.style.transform = `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0) translate(-50%, -50%) scale(${(0.85 + 0.15 * L.a).toFixed(3)})`;
    L.el.style.opacity = L.a < 0.01 ? '0' : (L.a * L.a).toFixed(3);
    L.el.style.fontSize = Math.max(9, Math.min(14, rr * 0.38)).toFixed(1) + 'px';
    L.el.style.textShadow = fs
      ? `${-fs}px 0 rgba(213,143,101,.9), ${fs}px 0 rgba(121,212,236,.9), 0 ${fs}px rgba(229,218,73,.7), 0 ${-fs}px rgba(185,157,227,.7)`
      : 'none';
  }
  for (const n of nodes) n.lab = n.labT;

  const tk = 1 - Math.exp(-dt * 6);
  if (tint.target) {
    tint.r += (tint.target[0] / 255 - tint.r) * tk;
    tint.g += (tint.target[1] / 255 - tint.g) * tk;
    tint.b += (tint.target[2] / 255 - tint.b) * tk;
  }
  tint.amt += ((tint.target ? 1 : 0) - tint.amt) * tk;
  invAmt += ((invert ? 1 : 0) - invAmt) * (reduce ? 1 : 1 - Math.exp(-dt * 8));

  // upload
  if (rd) {
    rd.update(dt, mouse.inside ? worldToUv(mouse.x, mouse.y) : [-10, -10]);
    gl.viewport(0, 0, W, H);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rd.tex());
  }
  gl.useProgram(prog);
  const gh = goohead && goohead.frame();
  gl.uniform1i(U.uText, 1);
  gl.uniform1f(U.uTextAmt, gh ? 1 : 0);
  if (gh) {
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, gh.tex);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform4f(U.uTextRect, gh.x, gh.y, gh.w, gh.h);
    gl.uniform2f(U.uTextSig, gh.s1, gh.s2);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  arrA.fill(0); arrB.fill(0);
  let count = 0;
  for (const n of nodes) {
    if (n.s < 0.01) continue;
    const e = n.s * n.s * (3 - 2 * n.s);
    const c = Math.cos(n.ang || 0), s = Math.sin(n.ang || 0);
    const ox = n.rox * c - n.roy * s, oy = n.rox * s + n.roy * c;
    const lab = n.lab || 0;
    const isTile = (n.tile >= 0 && workAmt > 0.3) || (n.cap >= 0 && capsAmt > 0.3);
    const flag = n.layer === 0 ? n.flag * (1 - lab) : (n.layer === 1 && lab > 0.5) || isTile ? 0 : n.flag;
    const rs = n.rs ?? 1;
    arrA.set([n.x, n.y, n.r * e * rs * (1 + 0.22 * lab) * (1 + 0.02 * (n.hov || 0)), flag], count * 4);
    const ext = (n.ex || 0) > 0.5 || (n.ey || 0) > 0.5;
    const cr = ext ? Math.min(n.cr ?? 1, 0.98) : n.cr ?? CORNER[n.sq];
    const bx = n.rox || n.roy ? n.x + ox : n.x + (n.ex || 0);
    const by = n.rox || n.roy ? n.y + oy : n.y + (n.ey || 0);
    arrB.set([bx, by, n.hole * e * rs * (1 - lab), n.layer + 4 * Math.round(cr * 255)], count * 4);
    count++;
  }
  gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uScale, scale);
  gl.uniform1f(U.uTime, time);
  gl.uniform4fv(U.uA, arrA);
  gl.uniform4fv(U.uB, arrB);
  gl.uniform1i(U.uCount, count);
  let pc = 0;
  for (const q of glyphs) {
    if (q.s < 0.01) continue;
    arrGa.set([q.x, q.y, q.size * q.s, q.rot], pc * 4);
    arrGb.set([q.g.t, q.g.p, q.st, q.g.f], pc * 4);
    pc++;
  }
  gl.uniform4fv(U.uGa, arrGa);
  gl.uniform4fv(U.uGb, arrGb);
  gl.uniform1i(U.uGCount, pc);
  const oa = LAYOUT_ORB[from], ob = LAYOUT_ORB[to];
  gl.uniform4f(U.uOrb, ...oa.map((v, j) => v + (ob[j] - v) * m));
  gl.uniform1f(U.uDash, dashMode);
  gl.uniform3f(U.uMouse, mirror ? mouse.ux : mouse.x, mouse.y, mouse.r);
  gl.uniform4f(U.uShock, shock.x, shock.y, shockR, shockAmp > 0.02 ? shockAmp : 0);
  // the grid needs crisp gutters, so the goo thins while it's up
  const gridAmt = Math.max(workAmt, capsAmt);
  gl.uniform1f(U.uK, Math.max(P_.k * (1 - 0.85 * gridAmt), 0.5));
  gl.uniform1f(U.uWork, gridAmt);
  gl.uniform1f(U.uGlow, P_.glow);
  gl.uniform1f(U.uContours, P_.contours);
  gl.uniform1f(U.uFlash, flash > 0.01 ? flash : 0);
  gl.uniform1f(U.uMirror, mirror ? 1 : 0);
  gl.uniform3f(U.uTint, tint.r, tint.g, tint.b);
  gl.uniform1f(U.uTintAmt, tint.amt);
  gl.uniform1f(U.uInvert, invAmt);
  gl.uniform1i(U.uRD, 0);
  gl.uniform1f(U.uRDAmt, rd ? P_.rd : 0);
  gl.uniform1f(U.uSpacing, P_.spacing);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  drawScope(time);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
